[project]
name = "mathscribe"
version = "0.1.0"
description = "Handwritten and printed math to LaTeX with a fine-tuned vision-language model."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ahmed Djalal HACINI" }]
requires-python = ">=3.10,<3.14"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# GPU training stack. Versions are lower bounds from the reference notebook run
# (Unsloth 2026.4.5, Transformers 5.5.0, Torch 2.10.0). Unsloth pins trl/transformers/torch.
train = [
    "unsloth>=2026.4.5",
    "datasets>=3.0",
    "huggingface_hub>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mathscribe"]

[tool.uv]
# Training only runs on Linux (Colab, Modal, RunPod). This keeps the lockfile small.
environments = ["sys_platform == 'linux'"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks/Qwen_3_5_SFT.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
